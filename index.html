<head>
<meta charset="utf-8">

<title>Přihlášení</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#222;--muted:#777;--line:#ddd;--accent:#444;--bad:#c33}
@media (prefers-color-scheme: dark){:root{--bg:#18181b;--card:#232327;--text:#eee;--muted:#999;--line:#3a3a40;--accent:#ddd;--bad:#f77}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:340px}
h1{font-size:18px;margin:0 0 16px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted);font-size:14px}
button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Přihlášení</h1>
  <input id="p" type="password" placeholder="Heslo" autocomplete="current-password" autofocus required>
  <label class="r"><input id="r" type="checkbox"> Zapamatovat na tomto zařízení</label>
  <button id="b">Pokračovat</button>
  <div id="err" role="alert"></div>
</form>

const KEY = 'k_' + (P ? P.s : '');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();

async function keysFromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.s), iterations: P.i }, base, 512));
}

async function open(keys) {
  const iv = b64(P.v), ct = b64(P.c);
  const mk = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  const data = new Uint8Array(iv.length + ct.length); data.set(iv); data.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', mk, b64(P.m), data)) return false;
  const ek = await crypto.subtle.importKey('raw', keys.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ek, ct));
  document.open(); document.write(html); document.close();
  document.title = 'Sbírka';
  return true;
}

const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} }
};

(async () => {
  if (!P || !window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'Stránku nejde otevřít v tomto prohlížeči.'; return; }
  const saved = store.get();
  if (saved) { try { if (await open(b64(saved))) return; } catch (e) {} store.del(); }
})();

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const keys = await keysFromPassword(document.getElementById('p').value);
    if (document.getElementById('r').checked) store.set(btoa(String.fromCharCode(...keys)));
    if (!await open(keys)) { store.del(); err.textContent = 'Špatné heslo.'; }
  } catch (x) { err.textContent = 'Něco se pokazilo, zkus to znovu.'; }
  btn.disabled = false;
});
</script>
</body>
